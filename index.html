<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartKitchen Energy Savings Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #111827;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: #1f2937;
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 10px;
      color: #9ca3af;
      font-size: 16px;
      line-height: 1.5;
    }

    h2 {
      margin-top: 40px;
      margin-bottom: 16px;
      font-size: 26px;
      font-weight: 600;
    }

    form {
      margin-top: 30px;
    }

    input,
    button,
    label {
      font-size: 16px;
      font-family: inherit;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #111827;
      color: #f9fafb;
      margin: 10px 0;
      transition: 0.2s ease;
    }

    input::placeholder {
      color: #6b7280;
    }

    input:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #16a34a;
    }

    .inline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .inline input {
      width: auto;
      margin: 0;
    }

    .days-wrap {
      display: none;
    }

    .days-wrap.show {
      display: block;
    }

    .hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: -2px;
      line-height: 1.4;
    }

    .error {
      color: #fecaca;
      background: rgba(127,29,29,0.35);
      padding: 12px;
      border-radius: 10px;
      margin: 12px 0;
      display: none;
    }

    .ok {
      font-size: 13px;
      color: #86efac;
      margin-top: 10px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 22px;
      margin-top: 18px;
    }

    .appliance-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .savings-big {
      font-size: 36px;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .savings-small {
      color: #d1d5db;
      line-height: 1.7;
      font-size: 15px;
    }

    .co2 {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #374151;
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .row {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 34px;
      }

      .container {
        padding: 24px;
      }

      .savings-big {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Energy Savings Calculator</h1>

    <div class="subtitle">
      Estimate operational cost savings and CO₂ reductions from reducing idle appliance runtime in commercial kitchens.
    </div>

    <div id="error" class="error"></div>
    <div id="status" class="ok"></div>

    <form id="appliance-form" novalidate>

      <input
        type="text"
        id="appliance-name"
        placeholder="Appliance Name (e.g., Oven)"
        required
      />

      <div class="row">
        <input
          type="number"
          id="wattage"
          step="any"
          min="0"
          placeholder="Appliance Power (Watts)"
        />

        <input
          type="number"
          id="amps"
          step="any"
          min="0"
          placeholder="Amps (e.g., 33.3)"
        />
      </div>

      <div class="row">
        <input
          type="number"
          id="volts"
          step="any"
          min="0"
          placeholder="Volts (e.g., 240)"
        />

        <input
          type="number"
          id="hours-off"
          step="any"
          min="0"
          placeholder="Hours Reduced Per Day"
          required
        />
      </div>

      <input
        type="number"
        id="kwh-rate"
        step="any"
        min="0"
        placeholder="Electricity Rate ($/kWh)"
        required
      />

      <div class="inline">
        <input type="checkbox" id="use-days"/>
        <label for="use-days">
          Calculate totals since installation
        </label>
      </div>

      <div id="days-wrap" class="days-wrap">
        <input
          type="number"
          id="days-since"
          step="any"
          min="0"
          placeholder="Days Since Installed"
        />

        <div class="hint">
          When enabled, the calculator will estimate total savings and CO₂ reductions since deployment.
        </div>
      </div>

      <button type="submit" id="add-btn">
        Add Appliance
      </button>

    </form>

    <div id="savings-summary">
      <h2>Estimated Savings</h2>
      <ul id="appliance-list"></ul>
    </div>

  </div>

  <script src="./script.js" defer></script>

</body>
</html>
